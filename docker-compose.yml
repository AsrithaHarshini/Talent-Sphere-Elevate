version: '3.8'

services:
  web:
    build: .
    container_name: talentsphere_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=talentsphere_super_secret_enterprise_key_2026
      - DATABASE_URL=sqlite:////app/talentsphere.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.1-120b
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./chromadb:/app/chromadb
      - ./talentsphere.db:/app/talentsphere.db
