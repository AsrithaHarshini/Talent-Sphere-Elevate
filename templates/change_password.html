{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card rounded-4 p-4 shadow-lg text-white border-warning">
            <div class="text-center mb-4">
                <i class="fas fa-key fs-1 text-warning mb-2"></i>
                <h4 class="fw-bold m-0">Set New Password</h4>
                <p class="text-white-50 small">You are using a temporary password. Please set a new password to continue.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control bg-dark text-white border-secondary" placeholder="At least 6 characters" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control bg-dark text-white border-secondary" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark rounded-pill">
                    <i class="fas fa-shield-alt me-1"></i> Update Password & Proceed
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
