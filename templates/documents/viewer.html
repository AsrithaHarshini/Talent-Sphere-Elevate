{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <!-- Header Breadcrumb & Metadata Banner -->
    <div class="glass-card rounded-4 p-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2 text-white">
        <div>
            <h4 class="mb-1 fw-bold"><i class="fas fa-file-pdf text-danger me-2"></i> {{ document.filename }}</h4>
            <div class="d-flex align-items-center gap-2 flex-wrap text-white-50 small">
                <span>Category: <strong>{{ document.category }}</strong></span>
                <span>Assigned Domain: <strong>{{ document.assigned_domain }}</strong></span>
            </div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="text-end">
                <div class="small text-white-50">Reading Progress</div>
                <div class="fw-bold text-success fs-5" id="pdf-progress-text">0%</div>
            </div>
            <button class="btn btn-success btn-sm rounded-pill fw-bold" onclick="markDocumentCompleted()" id="complete-doc-btn">
                <i class="fas fa-check-circle me-1"></i> Mark Document Read
            </button>
            <a href="{{ url_for('trainee.documents') }}" class="btn btn-outline-light btn-sm rounded-pill"><i class="fas fa-arrow-left me-1"></i> Back to Documents</a>
        </div>
    </div>

    <!-- Embedded Enterprise PDF Viewer Interface -->
    <div class="glass-card rounded-4 p-2 shadow-lg overflow-hidden" id="viewer-container">
        <!-- Toolbar -->
        <div class="d-flex justify-content-between align-items-center p-2 bg-dark rounded-3 text-white mb-2 flex-wrap gap-2 border border-secondary">
            <!-- Left Controls: Navigation -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary text-white" id="prev-page" title="Previous Page"><i class="fas fa-chevron-left"></i></button>
                <span>Page <input type="number" id="page-num-input" value="1" min="1" class="form-control form-control-sm d-inline-block text-center bg-dark text-white border-secondary" style="width: 55px;"> of <span id="page-count">--</span></span>
                <button class="btn btn-sm btn-outline-secondary text-white" id="next-page" title="Next Page"><i class="fas fa-chevron-right"></i></button>
            </div>

            <!-- Middle Controls: Search & Zoom -->
            <div class="d-flex align-items-center gap-2">
                <div class="input-group input-group-sm" style="width: 200px;">
                    <input type="text" id="search-input" class="form-control bg-dark text-white border-secondary" placeholder="Search document...">
                    <button class="btn btn-outline-secondary text-white" id="search-btn" title="Search"><i class="fas fa-search"></i></button>
                </div>
                <button class="btn btn-sm btn-outline-secondary text-white" id="zoom-out" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
                <span id="zoom-level" class="small text-muted">100%</span>
                <button class="btn btn-sm btn-outline-secondary text-white" id="zoom-in" title="Zoom In"><i class="fas fa-search-plus"></i></button>
            </div>

            <!-- Right Controls: Display Toggles -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-warning text-warning" id="bookmark-btn" title="Bookmark Page"><i class="far fa-bookmark"></i> Bookmark</button>
                <button class="btn btn-sm btn-outline-info text-info" id="dark-mode-toggle" title="Toggle Reader Theme"><i class="fas fa-moon"></i> Reader Theme</button>
                <button class="btn btn-sm btn-outline-light" id="fullscreen-btn" title="Toggle Fullscreen"><i class="fas fa-expand"></i> Fullscreen</button>
            </div>
        </div>

        <!-- Canvas PDF Reader Viewport -->
        <div class="text-center p-3 overflow-auto rounded-3" id="pdf-render-wrapper" style="min-height: 650px; max-height: 800px; background-color: #1E293B;">
            <canvas id="pdf-canvas" class="shadow-lg rounded"></canvas>
            <div id="search-results-notice" class="mt-2 small text-info d-none"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- PDF.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = "{{ url_for('download_file', filename=document.filename) }}";
    const documentId = {{ document.id }};
    let pdfDoc = null;
    let pageNum = {{ start_page if start_page else 1 }};
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.2;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    let maxPageVisited = pageNum;
    let isDarkModeReader = false;

    function renderPage(num) {
        pageRendering = true;
        pdfDoc.getPage(num).then(function(page) {
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            const renderTask = page.render(renderContext);
            renderTask.promise.then(function() {
                pageRendering = false;
                if (pageNumPending !== null) {
                    renderPage(pageNumPending);
                    pageNumPending = null;
                }
            });
        });

        document.getElementById('page-num-input').value = num;
        if (num > maxPageVisited) {
            maxPageVisited = num;
        }
        updateReadingProgress();
    }

    function queueRenderPage(num) {
        if (pageRendering) {
            pageNumPending = num;
        } else {
            renderPage(num);
        }
    }

    function markDocumentCompleted() {
        fetch('/trainee/lesson/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                document_id: documentId,
                pdf_read_pct: 100.0,
                video_watched_pct: 100.0
            })
        }).then(res => res.json()).then(data => {
            alert('🎉 Document marked as read!');
            window.location.href = "{{ url_for('trainee.documents') }}";
        }).catch(err => {
            alert('Document marked as read!');
            window.location.href = "{{ url_for('trainee.documents') }}";
        });
    }

    function updateReadingProgress() {
        if (!pdfDoc) return;
        const totalPages = pdfDoc.numPages;
        const progressPct = Math.min(100, Math.round((maxPageVisited / totalPages) * 100));
        document.getElementById('pdf-progress-text').innerText = progressPct + '%';

        // Send progress ping to server
        fetch('/trainee/lesson/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                document_id: documentId,
                pdf_read_pct: progressPct,
                current_page: pageNum
            })
        }).catch(err => console.log('Progress ping error:', err));
    }

    pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('page-count').textContent = pdfDoc.numPages;
        if (pageNum > pdfDoc.numPages) pageNum = 1;
        renderPage(pageNum);
    });

    document.getElementById('prev-page').addEventListener('click', function() {
        if (pageNum <= 1) return;
        pageNum--;
        queueRenderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', function() {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        queueRenderPage(pageNum);
    });

    document.getElementById('page-num-input').addEventListener('change', function(e) {
        let val = parseInt(e.target.value);
        if (val >= 1 && val <= pdfDoc.numPages) {
            pageNum = val;
            queueRenderPage(pageNum);
        }
    });

    document.getElementById('zoom-in').addEventListener('click', function() {
        scale += 0.2;
        document.getElementById('zoom-level').innerText = Math.round(scale * 100) + '%';
        queueRenderPage(pageNum);
    });

    document.getElementById('zoom-out').addEventListener('click', function() {
        if (scale <= 0.6) return;
        scale -= 0.2;
        document.getElementById('zoom-level').innerText = Math.round(scale * 100) + '%';
        queueRenderPage(pageNum);
    });

    document.getElementById('dark-mode-toggle').addEventListener('click', function() {
        const wrapper = document.getElementById('pdf-render-wrapper');
        isDarkModeReader = !isDarkModeReader;
        if (isDarkModeReader) {
            canvas.style.filter = 'invert(0.9) hue-rotate(180deg)';
            wrapper.style.backgroundColor = '#0F172A';
        } else {
            canvas.style.filter = 'none';
            wrapper.style.backgroundColor = '#1E293B';
        }
    });

    document.getElementById('fullscreen-btn').addEventListener('click', function() {
        const elem = document.getElementById('viewer-container');
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => alert(err.message));
        } else {
            document.exitFullscreen();
        }
    });

    document.getElementById('bookmark-btn').addEventListener('click', function() {
        alert(`Page ${pageNum} bookmarked for {{ document.filename }}.`);
    });

    document.getElementById('search-btn').addEventListener('click', function() {
        const query = document.getElementById('search-input').value.trim();
        const notice = document.getElementById('search-results-notice');
        if (!query) return;

        notice.classList.remove('d-none');
        notice.innerText = `Searching document for "${query}"...`;

        // Search text through pdf pages
        let matches = [];
        let searchPromises = [];
        for (let i = 1; i <= pdfDoc.numPages; i++) {
            searchPromises.push(pdfDoc.getPage(i).then(page => page.getTextContent().then(content => {
                let text = content.items.map(item => item.str).join(' ');
                if (text.toLowerCase().includes(query.toLowerCase())) {
                    matches.push(i);
                }
            })));
        }

        Promise.all(searchPromises).then(() => {
            if (matches.length > 0) {
                notice.innerText = `Found "${query}" on Page(s): ${matches.join(', ')}. Navigating to page ${matches[0]}.`;
                pageNum = matches[0];
                queueRenderPage(pageNum);
            } else {
                notice.innerText = `No occurrences of "${query}" found in this document.`;
            }
        });
    });
</script>
{% endblock %}
