{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card glass-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-chart-line text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold text-white mb-2" style="font-size: 1.35rem;">Talent Management Platform</h3>
                    <p class="text-primary small mb-2 fw-semibold">Employee Performance & Career Growth</p>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    
                    <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm" type="submit">
                        Sign In <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
